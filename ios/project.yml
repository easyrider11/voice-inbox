name: VoiceInbox
options:
  bundleIdPrefix: com.voiceinbox
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
targets:
  VoiceInbox:
    type: application
    platform: iOS
    sources:
      - VoiceInbox
    scheme:
      testTargets:
        - VoiceInboxTests
    info:
      path: VoiceInbox/Info.plist
      properties:
        CFBundleDisplayName: Voice Inbox
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSMicrophoneUsageDescription: Voice Inbox 用麦克风录下你的语音，转写并整理成待办、提醒和想法。
        NSLocalNetworkUsageDescription: Voice Inbox 需要连接你本地网络中的开发服务器来完成转写与整理。
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.voiceinbox.app
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1"
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "0.1.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: YG2PCP8NGY
  VoiceInboxTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - VoiceInboxTests
    dependencies:
      - target: VoiceInbox
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.voiceinbox.tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "6.0"
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/VoiceInbox.app/VoiceInbox
        BUNDLE_LOADER: $(TEST_HOST)
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: YG2PCP8NGY
