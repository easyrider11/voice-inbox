# fly launch --copy-config --name voice-inbox-api
# fly secrets set TENCENT_SECRET_ID=... TENCENT_SECRET_KEY=... ANTHROPIC_API_KEY=...
app = "voice-inbox-api"
primary_region = "sjc"

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
